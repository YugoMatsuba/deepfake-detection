server {
    listen 80;
    server_name _;

    # Allow large uploads (backend also set to 500MB)
    client_max_body_size 500M;

    # Serve built frontend (Vite output) from Nginx html root
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache immutable assets aggressively
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single Page App fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to the backend (Gunicorn)
    location /api/ {
        proxy_pass http://backend:5050;

        # Preserve host/proto for Flask behind proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Web timeouts suitable for uploads/long requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Allow large uploads through proxy path too
        client_max_body_size 500M;
    }
}
