version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
      args:
        DEVICE: cpu
    command: ["gunicorn", "--config", "backend/gunicorn.conf.py", "--chdir", "backend", "wsgi:app"]
    env_file:
      - ../.env
    environment:
      # Override defaults from .env for production deployment
      - ENVIRONMENT=production
      - PORT=5050
      - DATA_DIR=/data
      # DATABASE_URL should come from .env file (not hardcoded here)
      # POSTGRES credentials should come from .env file (not hardcoded here)
    volumes:
      # Code bind mount (for production; devcontainer uses different setup)
      - ..:/workspaces/deepfake_AI:ro
      # Persistent analysis data (videos, frames, forensic overlays)
      - analyses-data:/data
    expose:
      - "5050"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: deepfake_db
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # These should be set in .env file:
      # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
      - POSTGRES_USER=${POSTGRES_USER:-deepfake}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
      - POSTGRES_DB=${POSTGRES_DB:-deepfake_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deepfake} -d ${POSTGRES_DB:-deepfake_prod} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

# Named volumes with configurable bind mounts for persistent data
# BEFORE FIRST DEPLOYMENT:
#   1. Create host directories:
#      sudo mkdir -p /var/lib/deepfake/data /var/lib/deepfake/postgres
#   2. Set permissions:
#      sudo chown -R 1000:1000 /var/lib/deepfake/data
#      sudo chown -R 999:999 /var/lib/deepfake/postgres  # postgres uid
#   3. Set paths in .env:
#      DATA_VOLUME_PATH=/var/lib/deepfake/data
#      PG_VOLUME_PATH=/var/lib/deepfake/postgres
volumes:
  analyses-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Host path from environment variable, defaults to /var/lib/deepfake/data
      device: ${DATA_VOLUME_PATH:-/var/lib/deepfake/data}

  pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Host path from environment variable, defaults to /var/lib/deepfake/postgres
      device: ${PG_VOLUME_PATH:-/var/lib/deepfake/postgres}
