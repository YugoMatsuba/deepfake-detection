# Python project configuration for Black and Ruff
# Matches existing .flake8 standards (line-length=127, complexity=10)

[tool.black]
line-length = 127
target-version = ['py39', 'py311']
skip-string-normalization = false
skip-magic-trailing-comma = false

[tool.ruff]
# Match flake8 line length
line-length = 127

# Target Python 3.9+ (matches production and CI)
target-version = "py39"

# Select rule categories (matches flake8 E, F, C90, W)
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "C90", # mccabe complexity
]

# Ignore rules (matches .flake8 ignore list)
ignore = [
    "E402",  # module level import not at top of file
    "W503",  # line break before binary operator
    "W504",  # line break after binary operator
]

# Exclude directories (matches .flake8 exclude)
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "alembic/versions",
    "alembic/env.py",
]

# Per-file ignores (matches .flake8 per-file-ignores)
[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Allow unused imports in __init__ files

# McCabe complexity (matches .flake8 max-complexity=10)
[tool.ruff.mccabe]
max-complexity = 10
