name: Backend CI

on:
  push:
    branches: [ main, unittest ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 ffmpeg

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-ci.txt', 'backend/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        # Install CI dependencies (backend API only, no ML libraries)
        pip install -r requirements-ci.txt
        # Then install test dependencies
        pip install -r requirements-test.txt

    - name: Lint with flake8 (if available)
      working-directory: backend
      run: |
        pip install flake8 || echo "flake8 not installed, skipping lint"
        if command -v flake8 &> /dev/null; then
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        fi

    - name: Test with pytest
      working-directory: backend
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Generate coverage report
      working-directory: backend
      run: |
        python -m pytest tests/ --cov=api --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov (optional)
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  security-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit Security Linter
      working-directory: backend
      run: |
        # Run bandit with configuration file
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -f txt || echo "Security issues found but not failing build"

    - name: Check dependencies for known security vulnerabilities
      working-directory: backend
      run: |
        # Create a temporary requirements file from installed packages
        pip freeze > temp-requirements.txt
        safety check -r temp-requirements.txt || true
        rm temp-requirements.txt