name: Backend CI

on:
  push:
    branches: [ main, unittest ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deepfake
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5431:5432

    env:
      TEST_DATABASE_URL: postgresql+psycopg://deepfake:secret@localhost:5431

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 ffmpeg

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-ci.txt', 'backend/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        # Install full requirements including PostgreSQL driver
        pip install -r ../requirements.txt
        # Then install test dependencies
        pip install -r requirements-test.txt

    - name: Lint with flake8
      working-directory: backend
      run: |
        pip install flake8
        # Run flake8 with config file (.flake8)
        # This enforces code quality and will FAIL the build on violations
        flake8 .

    - name: Check formatting with Black
      working-directory: backend
      run: |
        # Black is installed via requirements-test.txt
        # This will FAIL if code is not formatted according to Black style
        black --check .

    - name: Lint with Ruff
      working-directory: backend
      run: |
        # Ruff is installed via requirements-test.txt
        # This will FAIL on linting violations (uses pyproject.toml config)
        ruff check .

    - name: Test with pytest + coverage
      working-directory: backend
      env:
        DATABASE_URL: postgresql+psycopg://deepfake:secret@localhost:5431
      run: |
        python -m pytest tests/ -v --tb=short --cov=api --cov-report=term-missing --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov (optional)
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  security-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit Security Linter
      working-directory: backend
      run: |
        # Fail build on high/medium severity security issues
        bandit -r . -ll -f txt \
          --exclude=./tests,./alembic \
          --skip=B404,B603

    - name: Check dependencies for known security vulnerabilities
      working-directory: backend
      run: |
        # Create a temporary requirements file from installed packages
        pip freeze > temp-requirements.txt
        # Fail build on known vulnerabilities (except development-only packages)
        safety check -r temp-requirements.txt --continue-on-error
        rm temp-requirements.txt
