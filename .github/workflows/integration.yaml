name: Integration CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - '.github/workflows/integration.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - '.github/workflows/integration.yaml'

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deepfake
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5431:5432

    env:
      TEST_DATABASE_URL: postgresql+psycopg://deepfake:secret@localhost:5431

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 ffmpeg postgresql-client

    - name: Install backend dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r ../requirements.txt  # Install full requirements including psycopg
        pip install -r requirements-test.txt

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Run backend API↔DB integration tests
      working-directory: backend
      env:
        DATABASE_URL: postgresql+psycopg://deepfake:secret@localhost:5431
      run: |
        python -m pytest tests/integration -v

    - name: Prepare PostgreSQL database for FE integration tests
      env:
        PGPASSWORD: secret
      run: |
        psql -h localhost -p 5431 -U deepfake postgres -c "DROP DATABASE IF EXISTS fe_integration_test;"
        psql -h localhost -p 5431 -U deepfake postgres -c "CREATE DATABASE fe_integration_test;"

    - name: Run FE↔API integration tests
      working-directory: frontend
      env:
        TEST_DATABASE_URL: postgresql+psycopg://deepfake:secret@localhost:5431
      run: |
        npm run test:integration
